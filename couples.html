<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASM CONVENT · Couples</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --pink-soft: #f9e0e8;
            --pink-light: #fbd3df;
            --pink: #f5a3c7;
            --pink-deep: #e87fa9;
            --pink-glow: rgba(245, 163, 199, 0.35);
            --glass-bg: rgba(255, 255, 255, 0.22);
            --glass-border: rgba(255, 255, 255, 0.40);
            --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --text-dark: #2e1c27;
            --text-soft: #5a3f4b;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --radius: 32px;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font-body);
            background: linear-gradient(145deg, #fce4ec 0%, #f8d0df 40%, #f5c0d4 100%);
            min-height: 100vh;
            padding: 0 20px 40px;
            color: var(--text-dark);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            font-size: 20px;
            opacity: 0.18;
            animation: floatHeart linear infinite;
            user-select: none;
        }
        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) scale(0.6) rotate(0deg);
                opacity: 0.10;
            }
            50% {
                opacity: 0.30;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(720deg);
                opacity: 0;
            }
        }
        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .school-header {
            text-align: center;
            padding: 28px 0 6px;
        }
        .school-name {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: clamp(1.4rem, 4vw, 2.8rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #b34a6e, #e87fa9, #b34a6e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerGlow 4s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 30px rgba(232, 127, 169, 0.30));
        }
        @keyframes shimmerGlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
        .sub-brand {
            font-family: var(--font-heading);
            font-weight: 400;
            font-size: clamp(1.2rem, 3vw, 2rem);
            letter-spacing: 4px;
            color: #b34a6e;
            opacity: 0.80;
            margin-top: -4px;
            background: linear-gradient(135deg, #b34a6e, #d47a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 20px rgba(232, 127, 169, 0.20));
        }
        .couple-headline {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 3.6rem);
            font-weight: 700;
            color: var(--text-dark);
            margin: 30px 0 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 50px rgba(245, 163, 199, 0.20);
        }
        .couple-headline span {
            background: linear-gradient(135deg, #b34a6e, #e87fa9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .couple-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            margin: 20px 0 30px;
        }
        .couple-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: var(--radius);
            padding: 30px 24px 26px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            transition: transform 0.30s ease, box-shadow 0.35s ease;
            animation: cardAppear 0.5s ease backwards;
            text-align: center;
        }
        .couple-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 16px 48px rgba(232, 127, 169, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.6) inset,
                0 0 40px rgba(245, 163, 199, 0.08);
        }
        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .couple-card .heart-icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 8px;
        }
        .couple-card .couple-name {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.3;
        }
        .couple-card .couple-name .girl {
            color: #b34a6e;
        }
        .couple-card .couple-name .boy {
            color: #3b7b9e;
        }
        .couple-card .couple-name .heart {
            color: #e87fa9;
            font-size: 1.6rem;
            margin: 0 6px;
        }
        .couple-card .sub-text {
            font-size: 0.85rem;
            color: var(--text-soft);
            opacity: 0.6;
            margin-top: 8px;
            font-style: italic;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 32px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.95rem;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(232, 127, 169, 0.15);
        }
        .footer-note {
            font-size: 0.7rem;
            color: var(--text-soft);
            opacity: 0.3;
            margin-top: 16px;
        }
        @media (max-width: 640px) {
            .couple-grid {
                grid-template-columns: 1fr;
            }
            .couple-card .couple-name {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== PARTICLES ===== -->
    <div class="particles" id="particles"></div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="school-header">
            <div class="school-name">ASM CONVENT SCHOOL, SUKHPURA, BALLIA</div>
            <div class="sub-brand">#RANDICOUPLE</div>
        </header>

        <!-- ===== COUPLE HEADLINE ===== -->
        <div class="couple-headline"><span>💗 COUPLE DAY 💗</span></div>

        <!-- ===== COUPLE GRID ===== -->
        <div class="couple-grid">
            <!-- COUPLE 1: Rosy & Harsh -->
            <div class="couple-card" style="animation-delay:0ms;">
                <span class="heart-icon">🤍</span>
                <div class="couple-name">
                    <span class="girl">Rosy</span>
                    <span class="heart">🤍</span>
                    <span class="boy">Harsh</span>
                </div>
                <div class="sub-text">— Two hearts, one beat —</div>
            </div>

            <!-- COUPLE 2: Aditi & Saurav -->
            <div class="couple-card" style="animation-delay:120ms;">
                <span class="heart-icon">🤍</span>
                <div class="couple-name">
                    <span class="girl">Aditi</span>
                    <span class="heart">🤍</span>
                    <span class="boy">Saurav</span>
                </div>
                <div class="sub-text">— Made for each other —</div>
            </div>
        </div>

        <!-- ===== BACK LINK ===== -->
        <a href="index.html" class="back-link">↩ Back to Main Website</a>

        <div class="footer-note">
            ✦ Edit this file directly to change couple names ✦
        </div>

    </div>

    <script>
        // ===== PARTICLES =====
        (function() {
            const container = document.getElementById('particles');
            if (!container) return;
            const symbols = ['♥', '♡', '✦', '✧', '♥', '♡'];
            for (let i = 0; i < 28; i++) {
                const el = document.createElement('span');
                el.className = 'particle';
                el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                const size = 14 + Math.random() * 28;
                el.style.fontSize = size + 'px';
                el.style.left = Math.random() * 100 + '%';
                el.style.animationDuration = (18 + Math.random() * 28) + 's';
                el.style.animationDelay = (Math.random() * 30) + 's';
                el.style.opacity = 0.08 + Math.random() * 0.22;
                container.appendChild(el);
            }
        })();
    </script>

</body>
</html>
